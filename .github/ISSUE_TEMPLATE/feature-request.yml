name: Feature request
description: Suggest an idea or an improvement for Verbene
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like Verbene to do?
      description: Describe the problem or the situation first, then your idea.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Anything else?
      description: How you work around it today, examples from other apps, screenshots.
