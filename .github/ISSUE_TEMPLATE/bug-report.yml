name: Bug report
description: Something is wrong in a Verbene beta build
labels: ["bug", "beta"]
body:
  - type: dropdown
    id: macos
    attributes:
      label: macOS
      options:
        - Sequoia 15
        - Tahoe 26
        - Golden Gate 27
        - Other
    validations:
      required: true
  - type: input
    id: macos-build
    attributes:
      label: macOS version and build
      description: Apple menu → About This Mac, or run `sw_vers`.
      placeholder: "15.8 (24H23)"
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: Mac model and chip
      placeholder: "MacBook Pro 14-inch, M3 Max"
    validations:
      required: true
  - type: input
    id: verbene
    attributes:
      label: Verbene version and build
      description: Verbene → About Verbene.
      placeholder: "0.9.0 (2)"
    validations:
      required: true
  - type: dropdown
    id: helper
    attributes:
      label: Full process coverage
      description: Status shown in Verbene → Settings… (⌘,)
      options:
        - "On"
        - Waiting for approval
        - "Off"
        - Don't know
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Steps to reproduce help most. Screenshots are welcome, but crop out anything private.
    validations:
      required: true
